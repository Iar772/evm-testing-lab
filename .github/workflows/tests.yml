name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Quality gates and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show tool versions
        run: |
          python --version
          pytest --version
          forge --version
          anvil --version
          cast --version

      - name: Build Solidity contracts
        run: forge build

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            --cov=evm \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Start Anvil
        run: |
          anvil \
            --host 127.0.0.1 \
            --port 8545 \
            > anvil.log 2>&1 &

      - name: Wait for Anvil readiness
        run: |
          for attempt in {1..30}; do
            if cast chain-id \
              --rpc-url http://127.0.0.1:8545 \
              > /dev/null 2>&1; then

              echo "Anvil is ready"
              cast chain-id --rpc-url http://127.0.0.1:8545
              exit 0
            fi

            echo "Waiting for Anvil... ${attempt}/30"
            sleep 1
          done

          echo "Anvil failed to become ready"
          cat anvil.log
          exit 1

      - name: Prepare Allure metadata
        run: |
          mkdir -p allure-results

          cat > allure-results/environment.properties <<EOF
          Network=Anvil
          ChainId=31337
          Python=3.12
          CI=GitHub Actions
          EOF

      - name: Run integration tests
        run: |
          pytest tests/integration \
            --alluredir=allure-results

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 2
          if-no-files-found: ignore

      - name: Upload Anvil log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anvil-log
          path: anvil.log
          retention-days: 2
          if-no-files-found: ignore

      - name: Install Allure Report
        if: >
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          npm install -g allure
          allure --version

      - name: Generate Allure HTML report
        if: >
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          allure generate allure-results \
            --output allure-report

      - name: Upload GitHub Pages artifact
        if: >
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

  deploy:
    name: Deploy Allure to GitHub Pages

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs: tests

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report
        id: deployment
        uses: actions/deploy-pages@v4